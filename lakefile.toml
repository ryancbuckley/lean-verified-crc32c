name = "leancrc32c"
version = "0.1.0"
defaultTargets = ["MemcpyCrc32c", "ReedSolomon"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "simdModels"
path = "lean-simd-models"

[[lean_lib]]
name = "MemcpyCrc32c"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]

[[lean_exe]]
name = "diff"
root = "tests.Diff"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]

[[lean_exe]]
name = "bench_portable"
root = "tests.BenchPortable"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]

[[lean_exe]]
name = "bench_memcpy"
root = "tests.BenchMemcpy"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]

[[lean_exe]]
name = "bench_xor"
root = "tests.BenchXor"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]

[[lean_lib]]
name = "ReedSolomon"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]

[[lean_exe]]
name = "bench_rs"
root = "tests.BenchRs"
moreLeancArgs = ["-include", "lean-simd-models/c/simd_shim.h"]
